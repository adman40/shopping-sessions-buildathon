name: V2 CI

on:
  pull_request:
    branches:
      - v2-rust-plan
  push:
    branches:
      - "v2/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate V2
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect V2 workspace
        id: workspace
        shell: bash
        run: |
          if [[ -f v2/Cargo.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Planning branch smoke check
        if: steps.workspace.outputs.present == 'false'
        shell: bash
        run: |
          if [[ -e v2 || -e scripts/v2_benchmark.py || -e scripts/v2_differential.py ]]; then
            echo "V2 test surface exists without v2/Cargo.toml" >&2
            exit 1
          fi
          test -f docs/V2_IMPLEMENTATION_PLAN.md
          echo "V2 workspace is not present yet; planning branch smoke check passed."

      - name: Verify locked Rust workspace
        if: steps.workspace.outputs.present == 'true'
        shell: bash
        run: |
          test -f v2/Cargo.lock
          cargo fmt --all --manifest-path v2/Cargo.toml --check
          cargo check --locked --manifest-path v2/Cargo.toml --workspace --all-targets
          cargo clippy --locked --manifest-path v2/Cargo.toml --workspace --all-targets -- -D warnings
          cargo test --locked --manifest-path v2/Cargo.toml --workspace

      - name: Install pinned Python dependencies
        if: steps.workspace.outputs.present == 'true'
        shell: bash
        run: python3 -m pip install --requirement requirements.txt

      - name: Run Slice 0 Python harness tests
        if: steps.workspace.outputs.present == 'true'
        shell: bash
        run: python3 -m unittest discover -s v2/tests -p 'test_*.py'

      - name: Run VM benchmark harness tests
        if: steps.workspace.outputs.present == 'true'
        shell: bash
        run: make bench-vm-test
